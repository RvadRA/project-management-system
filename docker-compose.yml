version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pms_postgres
    restart: always
    environment:
      POSTGRES_DB: pms_db
      POSTGRES_USER: pms_user
      # Пароль берётся из окружения (.env); значение по умолчанию — только для локальной разработки
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pms_password}
    ports:
      # База доступна только с этой машины, а не из сети
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
